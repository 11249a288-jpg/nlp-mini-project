<!DOCTYPE html>
<html>
<head>
<title>CampusSense</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5fc;
    color: #202544;
}

nav {
    background: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 10px #ddd;
}

nav h2 {
    color: #6655d9;
    margin: 0;
}

nav a {
    text-decoration: none;
    margin-left: 15px;
    color: #6655d9;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: 45px auto;
    padding: 20px;
}

.hero {
    background: linear-gradient(120deg, #6655d9, #9688f4);
    color: white;
    padding: 65px 35px;
    border-radius: 20px;
    text-align: center;
}

.hero h1 {
    font-size: 38px;
}

.hero p {
    line-height: 1.8;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #ddd;
    margin-bottom: 22px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin: 10px 0 18px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    height: 120px;
}

button, .btn {
    background: #6655d9;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    font-size: 14px;
}

button:hover, .btn:hover {
    background: #4939b8;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
}

.stat {
    background: white;
    padding: 22px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 15px #ddd;
}

.stat h2 {
    color: #6655d9;
    font-size: 30px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #eeeaff;
}

.Positive { color: green; font-weight: bold; }
.Negative { color: red; font-weight: bold; }
.Neutral  { color: #c28b2d; font-weight: bold; }

.flash {
    padding: 12px;
    background: #e5f7ed;
    color: #16784e;
    margin-bottom: 15px;
    border-radius: 8px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #888;
}

@media (max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 28px;
    }

    table {
        font-size: 12px;
    }

    .container {
        margin: 20px auto;
    }
}
</style>
</head>

<body>

<nav>
    <h2>CampusSense</h2>

    <div>
    {% if session.get('user_id') %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('signup') }}">Sign Up</a>
    {% endif %}
    </div>
</nav>

<div class="container">

    {% with messages = get_flashed_messages() %}
    {% for message in messages %}
    <div class="flash">{{ message }}</div>
    {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

<footer>
    Campus Issue Sentiment Analyzer | NLP Project
</footer>

</body>
</html>
